# CI pipeline for MiSTer_GroovyRelay.
#
# test job:
#   - Runs on every push to main/dev, every PR, and every tag push across
#     Linux, Windows, and macOS.
#   - Installs ffmpeg (required by integration tests — the sample-clip
#     generator and live Plane scenarios both shell out).
#   - go vet + go test (unit) + go test -tags=integration across the whole
#     module. Race tests run on Linux/macOS; Windows Go race builds require
#     CGO plus a C compiler, which the stock runner/dev setup does not have.
#     The integration glob is ./... (not just tests/integration/...) so any
#     //go:build integration test in another package also runs.
#   - Runs the sidecar fetch script guard test on Linux. That check asserts
#     macOS FFmpeg/FFprobe source-build requests fail before downloads when
#     invoked outside a macOS release runner.
#
# build-image job:
#   - Runs on any push (main, dev, v* tag). Skipped on pull_request
#     because Docker Hub credentials are not exposed to fork PRs.
#   - Uses the Docker Hub credentials configured as repo secrets:
#       DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#   - Publishes multi-arch images (linux/amd64 + linux/arm64) under a
#     single manifest per tag. Tag set is computed by metadata-action:
#       main push  -> :main, :main-<short-sha>
#       dev push   -> :dev,  :dev-<short-sha>
#       v* tag     -> :vX.Y.Z, :latest
#   - GitHub Actions cache (type=gha, mode=max) amortizes the ARM
#     emulation cost across runs.
name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y
      - run: go vet ./...
      - run: go test ./...
      - name: Sidecar script tests
        if: runner.os == 'Linux'
        run: bash scripts/fetch-sidecars-test.sh
      - name: Race tests
        if: runner.os != 'Windows'
        run: go test -race ./...
      - run: go test -tags=integration ./...

  build-image:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: idiosync000/mister-groovy-relay
          tags: |
            type=ref,event=branch
            type=ref,event=branch,suffix=-{{sha}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
