# CI pipeline for MiSTer_GroovyRelay.
#
# test job:
#   - Runs on every push to main/dev, every PR, and every tag push across
#     Linux, Windows, and macOS.
#   - Installs ffmpeg (required by integration tests — the sample-clip
#     generator and live Plane scenarios both shell out).
#   - go vet + go test (unit) + verbose go test -tags=integration for the
#     integration package. Race tests run on Linux/macOS; Windows Go race builds require
#     CGO plus a C compiler, which the stock runner/dev setup does not have.
#     Integration tests currently live under tests/integration; running that
#     package directly lets Go stream -v output instead of buffering behind ./...
#   - Runs the sidecar fetch script guard test on Linux. That check asserts
#     macOS FFmpeg/FFprobe source-build requests fail before downloads when
#     invoked outside a macOS release runner.
#
# build-image job:
#   - Runs on any push (main, dev, v* tag). Skipped on pull_request
#     because Docker Hub credentials are not exposed to fork PRs.
#   - Uses the Docker Hub credentials configured as repo secrets:
#       DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#   - Publishes multi-arch images (linux/amd64 + linux/arm64) under a
#     single manifest per tag. Tag set is computed by metadata-action:
#       main push  -> :main, :main-<short-sha>, :latest
#       dev push   -> :dev,  :dev-<short-sha>
#       v* tag     -> :vX.Y.Z
#   - Each platform builds natively on its own runner (ubuntu-latest,
#     ubuntu-24.04-arm) and pushes by digest; merge-image then publishes
#     the multi-arch manifest under the tag set. No QEMU: emulating the
#     arm64 librespot (Rust) and shairport-sync compiles took over an hour.
#   - GitHub Actions cache (type=gha, mode=max), scoped per platform,
#     keeps the helper stages cached across runs.
#   - A newer push to the same ref cancels an in-flight image build, so a
#     stale commit can never overwrite :main / :latest.
name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          # choco adds ffmpeg to the *machine* PATH via the registry, which
          # GitHub Actions does not propagate to subsequent steps. Resolve the
          # install dir here and re-export it through $GITHUB_PATH so the
          # integration step can actually find ffmpeg/ffprobe. Without this,
          # every real-ffmpeg integration test silently t.Skip()s on Windows
          # and the suite only fails on the one test that probes a hung server
          # (TestURL_ProbeTimeout), which returns instantly when ffprobe is
          # missing instead of hitting the probe-timeout ceiling.
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          $dir = Split-Path (Get-Command ffmpeg).Source
          Add-Content -Path $env:GITHUB_PATH -Value $dir
      - name: Verify ffmpeg/ffprobe on PATH
        run: |
          ffmpeg -version
          ffprobe -version
      - run: go vet ./...
      - run: go test ./...
      - name: Sidecar script tests
        if: runner.os == 'Linux'
        run: bash scripts/fetch-sidecars-test.sh
      - name: Release workflow tests
        if: runner.os == 'Linux'
        run: bash scripts/release-workflow-test.sh
      - name: Race tests
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Integration tests
        run: go test -tags=integration -v -timeout=5m ./tests/integration

  build-image:
    runs-on: ${{ matrix.runner }}
    needs: test
    if: github.event_name == 'push'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            pair: linux-amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            pair: linux-arm64
            runner: ubuntu-24.04-arm
    concurrency:
      group: build-image-${{ github.ref }}-${{ matrix.platform }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: idiosync000/mister-groovy-relay
      - uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=idiosync000/mister-groovy-relay,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.pair }}
          cache-to: type=gha,scope=build-${{ matrix.pair }},mode=max
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-image:
    runs-on: ubuntu-latest
    needs: build-image
    concurrency:
      group: merge-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: idiosync000/mister-groovy-relay
          tags: |
            type=ref,event=branch
            type=ref,event=branch,suffix=-{{sha}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Create and push the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'idiosync000/mister-groovy-relay@sha256:%s ' *)
      - name: Inspect the published manifest
        run: docker buildx imagetools inspect 'idiosync000/mister-groovy-relay:${{ steps.meta.outputs.version }}'
