name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/firefox/package-lock.json
      - name: Install extension dependencies
        working-directory: extension/firefox
        run: npm ci
      - name: Verify extension
        working-directory: extension/firefox
        run: |
          npm run check:versions
          npm test
          npm run lint
          npm run build
      - name: Detect extension release changes
        id: extension_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./extension/firefox/package.json').version")"
          # Reuse a previously AMO-signed XPI only when THIS release's extension
          # version was already signed on an earlier release — AMO refuses to
          # re-sign a version it has already accepted. Walk the release list
          # newest-first for the most recent release that actually carries a
          # signed XPI and read the signed version out of its asset name. This
          # deliberately skips failed/empty releases (whose CI died before
          # publishing) rather than trusting the immediately-previous tag, which
          # is what broke v1.10.2 (previous tag v1.10.1 published nothing).
          reuse_tag=""
          reuse_asset=""
          signed_version=""
          for tag in $(gh release list --limit 50 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[].tagName'); do
            [ "$tag" = "${GITHUB_REF_NAME}" ] && continue
            asset="$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null |
              awk '/^companion-extension-.*-signed\.xpi$/ { print; exit }')"
            if [ -n "$asset" ]; then
              reuse_tag="$tag"
              reuse_asset="$asset"
              signed_version="$(printf '%s\n' "$asset" |
                sed -E 's/^companion-extension-(.+)-signed\.xpi$/\1/')"
              break
            fi
          done
          if [ -n "$signed_version" ] && [ "$signed_version" = "$version" ]; then
            extension_changed=false
          else
            extension_changed=true
          fi
          echo "changed=$extension_changed" >> "$GITHUB_OUTPUT"
          echo "reuse_tag=$reuse_tag" >> "$GITHUB_OUTPUT"
          echo "reuse_asset=$reuse_asset" >> "$GITHUB_OUTPUT"
          echo "Extension version: $version"
          echo "Most recent signed version: ${signed_version:-<none>} (tag ${reuse_tag:-<none>})"
          echo "Sign fresh via AMO: $extension_changed"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign Firefox extension through AMO
        if: steps.extension_release.outputs.changed == 'true'
        working-directory: extension/firefox
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "AMO_JWT_ISSUER and AMO_JWT_SECRET secrets are required for Firefox signing." >&2
            exit 1
          fi
          npm run sign:amo
      - name: Prepare extension release assets
        id: extension_assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./extension/firefox/package.json').version")"
          release_dir="extension/firefox/dist/release"
          signed_asset="$release_dir/companion-extension-${version}-signed.xpi"
          mkdir -p "$release_dir"
          if [ "${{ steps.extension_release.outputs.changed }}" = "true" ]; then
            signed_xpi="$(find extension/firefox/dist/amo-signed -name '*.xpi' -type f | head -n 1)"
            if [ -z "$signed_xpi" ]; then
              echo "No signed XPI found in extension/firefox/dist/amo-signed." >&2
              find extension/firefox/dist -maxdepth 3 -type f >&2
              exit 1
            fi
            cp "$signed_xpi" "$signed_asset"
          else
            reuse_tag="${{ steps.extension_release.outputs.reuse_tag }}"
            reuse_asset="${{ steps.extension_release.outputs.reuse_asset }}"
            if [ -z "$reuse_tag" ] || [ -z "$reuse_asset" ]; then
              echo "No earlier release carries a signed Firefox XPI to reuse." >&2
              exit 1
            fi
            gh release download "$reuse_tag" \
              --pattern "$reuse_asset" \
              --dir "$release_dir" \
              --clobber
            downloaded_asset="$release_dir/$reuse_asset"
            if [ "$downloaded_asset" != "$signed_asset" ]; then
              mv "$downloaded_asset" "$signed_asset"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset=$signed_asset" >> "$GITHUB_OUTPUT"
      - name: Upload extension assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "${{ steps.extension_assets.outputs.asset }}" \
            --clobber
