# MiSTer_GroovyRelay configuration.
# The bridge writes this file into data_dir on first run if it's missing.
# Edit bridge.mister.host at minimum, then restart the bridge.

[bridge]
data_dir = ""                      # Auto-resolved per OS; override for custom state location
ffmpeg_path = ""                   # Empty = bundled sidecar, then PATH
ffprobe_path = ""                  # Empty = bundled sidecar, then PATH
ytdlp_path = ""                    # Empty = bundled sidecar, then PATH

[bridge.video]
modeline = "NTSC_480i"            # NTSC_480i, NTSC_240p, PAL_576i (experimental), PAL_288p (experimental)
interlace_field_order = "bff"     # "tff" | "bff" — flip if you see shimmer on CRT
aspect_mode = "auto"              # "letterbox" | "zoom" | "auto"
rgb_mode = "rgb888"               # v1: rgb888 only (rgba8888 / rgb565 reserved for v2+)
lz4_enabled = true                # LZ4 block compression (recommended)
delta_lz4_enabled = true          # Adaptive delta-LZ4 BLITs (recommended)

[bridge.audio]
sample_rate = 48000
channels = 2
output_volume = 100              # Global output gain sent to the MiSTer, 0..100

[bridge.visualizer]
mode = "retro_analyzer"           # retro_analyzer, oscilloscope_wave, stereo_scope, vu_cabinet, neon_grid, raster_pulse, cover_vu, cover_spectrum

[bridge.mister]
host = "192.168.1.50"             # MiSTer IP or hostname (required)
port = 32100                      # Groovy UDP port on the MiSTer (default 32100)
source_port = 32101               # Our stable source UDP port (kept across casts)
ssh_user = "root"                 # MiSTer's stock SSH user
ssh_password = "1"                # MiSTer's stock password. Change here if you've
                                  # hardened your MiSTer (or via the Settings UI).

[bridge.ui]
http_port = 32500                 # Bridge/UI HTTP port

[bridge.hls_buffer]
enabled = true                    # Buffer eligible live .m3u8 casts through a local segment cache
live_edge_segments = 3            # Stay this many segments behind the live edge
start_segments = 2                # Warm this many segments before starting FFmpeg
max_cached_segments = 6           # Rolling segment count retained per active cast
max_cache_bytes = 268435456       # Per-session cache byte ceiling
max_playlist_bytes = 1048576      # Maximum playlist response size accepted from origin
max_segment_bytes = 52428800      # Maximum segment response size accepted from origin
segment_timeout_seconds = 10      # HTTP timeout for segment downloads
playlist_timeout_seconds = 10     # HTTP timeout for playlist refreshes
max_variant_height = 720          # Highest master-playlist variant height eligible for buffering
stale_cache_reap_hours = 24       # Remove abandoned HLS cache directories after this age

# bridge.host_ip is the LAN IP this bridge advertises to Plex (/resources, plex.tv register).
# Leave it absent to auto-detect; set it explicitly on multi-NIC hosts where the
# Plex-facing NIC is not the default route.

[adapters.plex]
enabled = true
device_name = "MiSTer"            # Shown in Plex cast-target list
# device_uuid = ""                # Auto-generated on first run; persisted
profile_name = "Plex Home Theater"
# server_url = ""                 # Optional override; otherwise auto-discovered

[adapters.url]
enabled = false                   # Set to true (or use the UI toggle) to accept POST URL casts
ytdlp_enabled = true              # Master switch for yt-dlp resolution. When true,
                                  # auto mode routes URLs whose host matches ytdlp_hosts
                                  # through yt-dlp; mode=ytdlp forces it.
# ytdlp_hosts default is the curated list (youtube.com, twitch.tv, vimeo.com,
# archive.org, dailymotion.com, soundcloud.com, bandcamp.com, etc.). Override
# below to add more (e.g. tiktok.com, x.com — note these break frequently).
# ytdlp_hosts = ["youtube.com", "twitch.tv", "your-host.example"]
# ytdlp_format = "bv*[height<=720]+ba/bv*+ba/b"
# ytdlp_resolve_timeout_seconds = 30
# Cookies: paste a Netscape-format cookies.txt via the URL panel's Cookies
# section. Saved to <data_dir>/url_cookies.txt mode 0600 — not configurable
# in TOML by design.

[adapters.aux]
enabled = false

[adapters.aux.input]
id = "aux"
name = "AUX"
mode = "stream_url"              # "stream_url" or "local_capture"
audio_output = "visual_only"     # "visual_only" or "monitor"
url = "http://capture-host:8090/aux.wav"
format = ""                      # local_capture example: "alsa", "dshow", "avfoundation"
device = ""                      # local_capture example: "hw:1,0" or "audio=Line In (...)"
sample_rate = 48000
channels = 2
thread_queue_size = 64
analyze_duration_ms = 100
probe_size = 32768

[adapters.torrent]
enabled = false
traffic_acknowledged = false
download_dir = ""
keep_completed = false
max_cache_bytes = 21474836480
metadata_timeout_seconds = 60
startup_buffer_seconds = 10
max_upload_rate_kbps = 512
max_download_rate_kbps = 0
listen_port = 0

[adapters.dlna]
enabled = false                   # Set to true to advertise as a DLNA / UPnP MediaRenderer.
                                  # WARNING: DLNA exposes unauthenticated LAN control —
                                  # any device on the LAN can change what plays.
device_name = "MiSTer"            # Friendly name shown in DLNA controllers.
                                  # Restart-bridge: changes apply on next start.
autoplay_on_set_uri = false       # Some controllers set a URI but never send Play.
                                  # Enable for compatibility with those controllers.
allow_public_source_urls = false  # Default false; private/LAN targets always allowed.
                                  # When true, accepts media URLs that resolve to
                                  # public-internet addresses (SSRF risk).
