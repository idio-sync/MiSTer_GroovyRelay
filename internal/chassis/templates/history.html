{{define "history"}}
{{htmlComment "chassis:history"}}
<div class="history-section section-strip">
  <span class="strip-label">History</span>
  <div>
    {{if .Rows}}
      {{range .Rows}}
      <div class="history-row">
        <div class="artwork">{{.Artwork}}</div>
        <div class="title">{{.Title}}</div>
        <div class="source">{{.Source}}</div>
        <div class="when">{{.When}}</div>
        {{if .ReplayID}}
        <button class="history-replay-btn" type="button" data-history-replay-id="{{.ReplayID}}" aria-label="Recast {{.Title}} from history" title="Recast">&#9656;</button>
        {{else}}
        <span class="history-replay-placeholder" aria-hidden="true"></span>
        {{end}}
      </div>
      {{end}}
    {{else}}
      <div class="history-empty">{{.EmptyMessage}}</div>
    {{end}}
  </div>
</div>
{{end}}
