# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - go mod tidy
    - bash scripts/fetch-sidecars.sh

builds:
  - id: mister-groovy-relay
    main: ./cmd/mister-groovy-relay
    binary: mister-groovy-relay
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    hooks:
      post:
        - cmd: bash scripts/codesign-if-darwin.sh "{{ .Path }}" "{{ .Target }}"

archives:
  - id: default
    formats: ['tar.gz']
    format_overrides:
      - goos: windows
        formats: ['zip']
    files:
      - README.md
      - THIRD_PARTY_NOTICES.md
      - LICENSES/**
      - src: dist/sidecars/{{ .Os }}_{{ .Arch }}/*
        dst: .
        strip_parent: true

changelog:
  use: github-native

release:
  github:
    owner: idio-sync
    name: MiSTer_GroovyRelay
  extra_files:
    - glob: dist/sidecar-cache/*

checksum:
  name_template: 'checksums.txt'
